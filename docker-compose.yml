# PostgreSQL local para DualLedger
# Uso:
#   docker compose up -d        # levanta Postgres y aplica server/schema.sql al primer arranque
#   docker compose down         # detiene el contenedor (sin borrar datos)
#   docker compose down -v      # detiene y borra los datos (volumen pgdata)
#
# En producción en tu propio dominio/servidor, reemplaza esta config por tu PostgreSQL (VPS, etc.).
services:
  postgres:
    image: postgres:16-alpine
    container_name: dualledger-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dualledger
      POSTGRES_PASSWORD: dualledger
      POSTGRES_DB: dualledger
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Aplica el schema automáticamente la primera vez que se crea el volumen
      - ./server/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dualledger -d dualledger"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata: