<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a56db"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="bookL" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="bookR" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
  </defs>

  <!-- Fondo redondeado -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>

  <!-- Libro izquierdo (base) -->
  <g>
    <path d="M118 142 L236 118 V366 L118 390 Z" fill="url(#bookL)" stroke="#ffffff" stroke-width="0" stroke-linejoin="round"/>
    <path d="M118 142 L236 118 V366 L118 390 Z" fill="none" stroke="rgba(255,255,255,0.9)" stroke-width="10" stroke-linejoin="round"/>
    <!-- Lomo del libro izquierdo -->
    <path d="M118 142 L118 390" stroke="#0f3d9e" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- Libro derecho (superpuesto) -->
  <g>
    <path d="M276 118 L394 142 V390 L276 366 Z" fill="url(#bookR)" stroke="rgba(255,255,255,0.9)" stroke-width="10" stroke-linejoin="round"/>
    <!-- Lomo del libro derecho -->
    <path d="M394 142 L394 390" stroke="#0f3d9e" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- Lineas de texto contable en el libro izquierdo -->
  <g stroke="#2563eb" stroke-width="12" stroke-linecap="round" opacity="0.7">
    <line x1="146" y1="176" x2="206" y2="168"/>
    <line x1="146" y1="216" x2="206" y2="208"/>
    <line x1="146" y1="256" x2="206" y2="248"/>
    <line x1="146" y1="296" x2="206" y2="288"/>
  </g>

  <!-- Lineas de texto contable en el libro derecho -->
  <g stroke="#2563eb" stroke-width="12" stroke-linecap="round" opacity="0.7">
    <line x1="304" y1="168" x2="366" y2="176"/>
    <line x1="304" y1="208" x2="366" y2="216"/>
    <line x1="304" y1="248" x2="366" y2="256"/>
    <line x1="304" y1="288" x2="366" y2="296"/>
  </g>
</svg>
